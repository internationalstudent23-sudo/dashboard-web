<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
  <title>장비 상태 실시간 대시보드</title>
  
  <!-- PWA 모바일 앱 설정 태그 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e293b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="장비대시보드">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3043/3043888.png">

  <!-- Tailwind CSS 불러오기 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 장비 마커가 도면 위에서 정중앙에 오도록 보정 */
    .eq-marker {
      transform: translate(-50%, -50%);
    }
    /* 모바일 터치 시 파란색 하이라이트 제거 */
    * {
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen p-3 md:p-8 font-sans pb-20">

  <!-- 상단 헤더 & 상태 범례 -->
  <header class="max-w-6xl mx-auto mb-4 md:mb-6 flex flex-col md:flex-row justify-between items-start md:items-center bg-white p-4 md:p-5 rounded-xl shadow-sm border border-slate-200">
    <div>
      <div class="flex flex-wrap items-center gap-2.5">
        <h1 class="text-xl md:text-2xl font-bold text-slate-800">장비 상태 모니터링 대시보드</h1>
        <span id="sync-badge" class="text-xs px-2.5 py-1 rounded-full bg-amber-100 text-amber-700 font-semibold">
          데이터 연동 중...
        </span>
      </div>
      <p class="text-xs md:text-sm text-slate-500 mt-1">도면 위의 장비를 터치하거나 하단 목록에서 검색하여 상세 제원을 확인하세요.</p>
    </div>
    
    <!-- 상태 색상 안내 (범례) & 새로고침 버튼 -->
    <div class="w-full md:w-auto flex flex-wrap items-center justify-between md:justify-end gap-3 mt-4 md:mt-0">
      <div class="flex gap-3 md:gap-5 text-xs md:text-sm font-semibold bg-slate-50 px-3.5 py-2 rounded-lg border border-slate-200">
        <div class="flex items-center gap-1.5">
          <span class="w-3 h-3 rounded-full bg-emerald-500 shadow-sm shadow-emerald-300"></span>
          <span class="text-slate-700">사용가능</span>
        </div>
        <div class="flex items-center gap-1.5">
          <span class="w-3 h-3 rounded-full bg-rose-500 shadow-sm shadow-rose-300"></span>
          <span class="text-slate-700">사용 중</span>
        </div>
        <div class="flex items-center gap-1.5">
          <span class="w-3 h-3 rounded-full bg-slate-400"></span>
          <span class="text-slate-700">불용</span>
        </div>
      </div>
      <button onclick="loadSheetData()" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 active:scale-95 text-white text-xs md:text-sm font-semibold rounded-lg shadow-sm transition-all">
        🔄 새로고침
      </button>
    </div>
  </header>

  <!-- 메인 도면 영역 -->
  <main class="max-w-6xl mx-auto bg-white p-3 md:p-4 rounded-xl shadow-sm border border-slate-200 mb-6">
    
    <!-- 모바일 전용 도면 확대 컨트롤 바 -->
    <div class="flex justify-between items-center mb-2 md:hidden bg-slate-50 px-3 py-2 rounded-lg border border-slate-200">
      <span class="text-xs text-slate-600 font-medium">📱 버튼이 작다면 도면을 확대해 보세요</span>
      <button id="zoom-toggle-btn" onclick="toggleMobileZoom()" class="text-xs bg-blue-600 text-white px-2.5 py-1 rounded font-bold shadow-sm">
        🔍 크게 보기
      </button>
    </div>

    <!-- 도면 스크롤 래퍼 (모바일 확대 시 좌우 스크롤 지원) -->
    <div id="map-scroll-wrapper" class="w-full overflow-x-auto rounded-lg border border-slate-300 bg-slate-50">
      <div id="map-container" class="relative w-full transition-all duration-200 cursor-crosshair">
        
        <!-- 1. 배경 평면도 이미지 (udmc.png) -->
        <img src="images/udmc.png" alt="사무실 평면도" class="w-full h-auto block select-none">

        <!-- 2. 장비 마커 버튼들 (모바일 터치 최적화 적용) -->
        
        <!-- 장비 1: 3D Laser Microscope -->
        <button data-id="1" onclick="openEquipmentModal('1')" style="left: 60%; top: 30%;" 
          class="eq-marker absolute px-2.5 py-1 md:px-3 md:py-1.5 rounded-full bg-slate-400 text-white font-bold text-[11px] md:text-sm shadow-lg hover:scale-110 active:scale-95 transition-all flex items-center gap-1.5 border-2 border-white whitespace-nowrap">
          <span class="status-dot w-2 h-2 rounded-full bg-white"></span>
          <span class="eq-label">3D Laser Microscope</span>
        </button>

        <!-- 장비 2: 3D Printer -->
        <button data-id="2" onclick="openEquipmentModal('2')" style="left: 60%; top: 40%;" 
          class="eq-marker absolute px-2.5 py-1 md:px-3 md:py-1.5 rounded-full bg-slate-400 text-white font-bold text-[11px] md:text-sm shadow-lg hover:scale-110 active:scale-95 transition-all flex items-center gap-1.5 border-2 border-white whitespace-nowrap">
          <span class="status-dot w-2 h-2 rounded-full bg-white"></span>
          <span class="eq-label">3D Printer</span>
        </button>

        <!-- 장비 3: 3D Scanner -->
        <button data-id="3" onclick="openEquipmentModal('3')" style="left: 60%; top: 50%;" 
          class="eq-marker absolute px-2.5 py-1 md:px-3 md:py-1.5 rounded-full bg-slate-400 text-white font-bold text-[11px] md:text-sm shadow-lg hover:scale-110 active:scale-95 transition-all flex items-center gap-1.5 border-2 border-white whitespace-nowrap">
          <span class="status-dot w-2 h-2 rounded-full bg-white"></span>
          <span class="eq-label">3D Scanner</span>
        </button>

      </div>
    </div>
  </main>

  <!-- ========================================================= -->
  <!-- 5단계 신규: 전체 장비 목록 & 검색 (스마트폰 한 손 조작 최적화) -->
  <!-- ========================================================= -->
  <section class="max-w-6xl mx-auto bg-white p-4 md:p-6 rounded-xl shadow-sm border border-slate-200">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-3 mb-4">
      <div>
        <h2 class="text-lg font-bold text-slate-800">📋 전체 장비 현황 목록</h2>
        <p class="text-xs text-slate-500">구글 시트에 등록된 모든 장비가 자동으로 표시됩니다.</p>
      </div>

      <!-- 검색창 & 상태 필터 버튼 -->
      <div class="w-full md:w-auto flex flex-col sm:flex-row gap-2">
        <input id="search-input" type="text" oninput="renderEquipmentList()" placeholder="장비명, 제조사, 호실 검색..." 
          class="px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:border-slate-800">
        
        <div class="flex gap-1 bg-slate-100 p-1 rounded-lg text-xs font-bold">
          <button onclick="setFilter('전체')" id="filter-all" class="px-2.5 py-1.5 rounded-md bg-white text-slate-800 shadow-sm">전체</button>
          <button onclick="setFilter('사용가능')" id="filter-avail" class="px-2.5 py-1.5 rounded-md text-slate-600">사용가능</button>
          <button onclick="setFilter('사용중')" id="filter-busy" class="px-2.5 py-1.5 rounded-md text-slate-600">사용 중</button>
          <button onclick="setFilter('불용')" id="filter-down" class="px-2.5 py-1.5 rounded-md text-slate-600">불용</button>
        </div>
      </div>
    </div>

    <!-- 장비 카드들이 자동으로 그려지는 그리드 영역 -->
    <div id="equipment-list-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
      <!-- 자바스크립트가 시트 데이터를 읽어와 자동으로 채워줍니다 -->
    </div>
  </section>

  <!-- ========================================== -->
  <!-- 4단계: 장비 상세 정보 모달 (팝업창) 영역     -->
  <!-- ========================================== -->
  <div id="eq-modal" onclick="if(event.target === this) closeEquipmentModal()" 
    class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center z-50 p-3 md:p-4">
    
    <div class="bg-white rounded-2xl max-w-lg w-full overflow-hidden shadow-2xl border border-slate-200">
      
      <!-- 모달 상단 헤더 -->
      <div class="px-5 py-4 bg-slate-800 text-white flex justify-between items-center">
        <div class="flex items-center gap-2.5">
          <span id="modal-status-badge" class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-emerald-500 text-white whitespace-nowrap">
            상태
          </span>
          <h2 id="modal-name" class="text-base md:text-lg font-bold tracking-tight line-clamp-1">장비 이름</h2>
        </div>
        <button onclick="closeEquipmentModal()" class="text-slate-400 hover:text-white text-2xl leading-none font-bold px-1">&times;</button>
      </div>

      <!-- 모달 본문 영역 -->
      <div class="p-5 max-h-[75vh] overflow-y-auto">
        
        <!-- 장비 실사 사진 -->
        <div class="w-full h-48 md:h-52 bg-slate-100 rounded-xl overflow-hidden mb-4 border border-slate-200 flex items-center justify-center">
          <img id="modal-image" src="" alt="장비 사진" class="w-full h-full object-cover" 
            onerror="this.src='https://placehold.co/600x400/e2e8f0/64748b?text=No+Image';">
        </div>

        <!-- I열 위치 정보 강조 배너 (위치 : 107동 110호 형태) -->
        <div class="mb-4 bg-blue-50 border border-blue-200 rounded-lg px-4 py-2.5 flex items-center gap-2 text-blue-900 font-bold text-sm">
          <span>📍</span>
          <span id="modal-location">위치 : 정보 없음</span>
        </div>

        <!-- 세부 제원 테이블 (B, E, F, G열) -->
        <div class="grid grid-cols-2 gap-2.5 text-sm mb-4">
          <div class="bg-slate-50 p-3 rounded-lg border border-slate-200">
            <span class="text-xs text-slate-400 block mb-0.5">제조사 (Maker)</span>
            <span id="modal-maker" class="font-semibold text-slate-800">-</span>
          </div>
          <div class="bg-slate-50 p-3 rounded-lg border border-slate-200">
            <span class="text-xs text-slate-400 block mb-0.5">시리얼 번호 (S/N)</span>
            <span id="modal-serial" class="font-semibold text-slate-800">-</span>
          </div>
          <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 col-span-2">
            <span class="text-xs text-slate-400 block mb-0.5">담당자 (Manager)</span>
            <span id="modal-manager" class="font-semibold text-slate-800">-</span>
          </div>
          <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 col-span-2">
            <span class="text-xs text-slate-400 block mb-0.5">주요 제원 (Spec)</span>
            <span id="modal-spec" class="font-semibold text-slate-800 whitespace-pre-line">-</span>
          </div>
        </div>

        <!-- 점검 및 수리 이력 (H열) -->
        <div class="bg-amber-50/70 p-3.5 rounded-lg border border-amber-200 text-sm">
          <span class="text-xs font-bold text-amber-800 block mb-1">🛠️ 점검 및 수리 이력 (History)</span>
          <p id="modal-history" class="text-slate-700 whitespace-pre-line leading-relaxed">-</p>
        </div>

      </div>

      <!-- 모달 하단 닫기 버튼 -->
      <div class="px-5 py-3 bg-slate-50 border-t border-slate-200 text-right">
        <button onclick="closeEquipmentModal()" class="w-full md:w-auto px-6 py-2.5 bg-slate-800 hover:bg-slate-700 text-white text-sm font-semibold rounded-lg transition-colors">
          닫기
        </button>
      </div>

    </div>
  </div>

  <!-- [개발자용 도구] PC 화면에서만 클릭한 위치의 % 좌표를 알려주는 알림창 -->
  <div id="coord-helper" class="hidden md:block fixed bottom-5 right-5 bg-slate-900/90 text-white px-4 py-3 rounded-xl text-xs font-mono shadow-xl border border-slate-700 z-40">
    📍 도면 빈 공간을 클릭하면 좌표가 표시됩니다.
  </div>

  <!-- ========================================== -->
  <!-- 자바스크립트 로직 (시트 연동 + 모바일 기능)  -->
  <!-- ========================================== -->
  <script>
    const SHEET_ID = '19zEMMIxs7OA3vaLyk0T7ODiXzAJ02uUrCwbt1RENhoM';
    const SHEET_NAME = '시트1';

    let equipmentData = {};
    let currentFilter = '전체';
    let isMobileZoomed = false;

    // 1. 구글 시트 데이터 불러오기 함수
    function loadSheetData() {
      const syncBadge = document.getElementById('sync-badge');
      syncBadge.textContent = '시트 데이터 불러오는 중...';

      const oldScript = document.getElementById('google-sheet-script');
      if (oldScript) oldScript.remove();

      const script = document.createElement('script');
      script.id = 'google-sheet-script';
      script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=responseHandler:parseSheetData&sheet=${encodeURIComponent(SHEET_NAME)}`;
      script.onerror = function() {
        syncBadge.textContent = '⚠️ 시트 연동 실패';
        syncBadge.className = 'text-xs px-2.5 py-1 rounded-full bg-rose-100 text-rose-700 font-semibold';
      };
      document.body.appendChild(script);
    }

    // 2. 구글 시트 데이터 파싱 (A열~J열)
    window.parseSheetData = function(response) {
      if (!response || !response.table) return;

      const rows = response.table.rows;
      const newData = {};

      rows.forEach(row => {
        const c = row.c;
        if (!c || !c[0] || c[0].v === null) return;

        const getVal = (index) => (c[index] && c[index].v !== null) ? String(c[index].v).trim() : '';

        const id = getVal(0);
        if (id === 'id') return;

        let imgPath = getVal(9);
        if (imgPath.startsWith('ai/')) {
          imgPath = imgPath.replace(/^ai\//, '');
        }

        newData[id] = {
          id: id,                 // A열: id
          maker: getVal(1),       // B열: maker
          name: getVal(2),        // C열: name
          status: getVal(3),      // D열: status
          serial: getVal(4),      // E열: serial
          manager: getVal(5),     // F열: manager
          spec: getVal(6),        // G열: spec
          history: getVal(7),     // H열: history
          location: getVal(8),    // I열: location
          image: imgPath          // J열: image
        };
      });

      equipmentData = newData;
      updateMapMarkers();
      renderEquipmentList();

      const now = new Date().toLocaleTimeString('ko-KR');
      const syncBadge = document.getElementById('sync-badge');
      syncBadge.textContent = `✅ 실시간 연동됨 (${now})`;
      syncBadge.className = 'text-xs px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-700 font-semibold';
    };

    // 3. 도면 위 장비 마커 색상 업데이트
    function updateMapMarkers() {
      const buttons = document.querySelectorAll('.eq-marker');

      buttons.forEach(btn => {
        const id = btn.getAttribute('data-id');
        const info = equipmentData[id];
        if (!info) return;

        const label = btn.querySelector('.eq-label');
        if (label && info.name) label.textContent = info.name;

        btn.classList.remove('bg-emerald-500', 'bg-rose-500', 'bg-slate-400', 'bg-slate-500');
        const dot = btn.querySelector('.status-dot');
        if (dot) dot.classList.remove('animate-pulse');

        if (info.status === '사용가능') {
          btn.classList.add('bg-emerald-500');
          if (dot) dot.classList.add('animate-pulse');
        } else if (info.status === '사용중' || info.status === '사용 중') {
          btn.classList.add('bg-rose-500');
        } else {
          btn.classList.add('bg-slate-400');
        }
      });
    }

    // 4. 하단 전체 장비 카드 목록 자동 생성 함수 (모바일 편의성 극대화)
    function renderEquipmentList() {
      const grid = document.getElementById('equipment-list-grid');
      const keyword = document.getElementById('search-input').value.toLowerCase().trim();
      grid.innerHTML = '';

      Object.values(equipmentData).forEach(item => {
        // 상태 필터링 검사
        if (currentFilter !== '전체') {
          const normalizedStatus = (item.status === '사용 중') ? '사용중' : item.status;
          if (normalizedStatus !== currentFilter) return;
        }

        // 검색어 필터링 검사
        const searchTarget = `${item.name} ${item.maker} ${item.location} ${item.manager}`.toLowerCase();
        if (keyword && !searchTarget.includes(keyword)) return;

        // 상태별 뱃지 스타일
        let badgeClass = 'bg-slate-100 text-slate-600';
        let dotClass = 'bg-slate-400';
        if (item.status === '사용가능') {
          badgeClass = 'bg-emerald-50 text-emerald-700 border border-emerald-200';
          dotClass = 'bg-emerald-500';
        } else if (item.status === '사용중' || item.status === '사용 중') {
          badgeClass = 'bg-rose-50 text-rose-700 border border-rose-200';
          dotClass = 'bg-rose-500';
        }

        const card = document.createElement('div');
        card.onclick = () => openEquipmentModal(item.id);
        card.className = 'p-3.5 rounded-xl border border-slate-200 hover:border-slate-400 bg-slate-50/50 hover:bg-white transition-all cursor-pointer flex justify-between items-center shadow-sm active:scale-[0.99]';
        card.innerHTML = `
          <div class="pr-2">
            <div class="flex items-center gap-1.5 text-xs text-slate-400 font-semibold mb-0.5">
              <span>#${item.id}</span>
              <span>•</span>
              <span>${item.maker || '-'}</span>
              <span>•</span>
              <span class="text-blue-600">${item.location || '위치 미지정'}</span>
            </div>
            <h3 class="font-bold text-slate-800 text-sm md:text-base">${item.name}</h3>
            <p class="text-xs text-slate-500 mt-0.5">${item.manager || ''}</p>
          </div>
          <span class="px-2.5 py-1 rounded-full text-xs font-bold flex items-center gap-1.5 whitespace-nowrap ${badgeClass}">
            <span class="w-2 h-2 rounded-full ${dotClass}"></span>
            ${item.status || '미지정'}
          </span>
        `;
        grid.appendChild(card);
      });
    }

    // 상태 필터 버튼 변경 함수
    function setFilter(filterName) {
      currentFilter = filterName;
      const btnIds = { '전체': 'filter-all', '사용가능': 'filter-avail', '사용중': 'filter-busy', '불용': 'filter-down' };
      Object.entries(btnIds).forEach(([key, id]) => {
        const btn = document.getElementById(id);
        if (key === filterName) {
          btn.className = 'px-2.5 py-1.5 rounded-md bg-white text-slate-800 shadow-sm';
        } else {
          btn.className = 'px-2.5 py-1.5 rounded-md text-slate-600';
        }
      });
      renderEquipmentList();
    }

    // 모바일 도면 2배 확대/축소 토글 함수
    function toggleMobileZoom() {
      const mapContainer = document.getElementById('map-container');
      const btn = document.getElementById('zoom-toggle-btn');
      isMobileZoomed = !isMobileZoomed;

      if (isMobileZoomed) {
        mapContainer.style.width = '200%'; // 도면을 2배로 키워 좌우 스크롤 가능하게 만듦
        btn.textContent = '축소하기';
        btn.className = 'text-xs bg-slate-700 text-white px-2.5 py-1 rounded font-bold shadow-sm';
      } else {
        mapContainer.style.width = '100%';
        btn.textContent = '🔍 크게 보기';
        btn.className = 'text-xs bg-blue-600 text-white px-2.5 py-1 rounded font-bold shadow-sm';
      }
    }

    // 5. 장비 클릭 시 모달 열기
    function openEquipmentModal(id) {
      const info = equipmentData[id];
      if (!info) return;

      document.getElementById('modal-name').textContent = info.name || '-';
      document.getElementById('modal-location').textContent = `위치 : ${info.location || '미지정'}`;
      document.getElementById('modal-maker').textContent = info.maker || '-';
      document.getElementById('modal-serial').textContent = info.serial || '-';
      document.getElementById('modal-manager').textContent = info.manager || '-';
      document.getElementById('modal-spec').textContent = info.spec || '-';
      document.getElementById('modal-history').textContent = info.history || '등록된 이력이 없습니다.';

      const imgEl = document.getElementById('modal-image');
      imgEl.src = info.image ? info.image : 'https://placehold.co/600x400/e2e8f0/64748b?text=No+Image';

      const badge = document.getElementById('modal-status-badge');
      badge.textContent = info.status || '상태 미지정';
      badge.className = 'px-2.5 py-0.5 rounded-full text-xs font-bold text-white whitespace-nowrap ';
      if (info.status === '사용가능') {
        badge.classList.add('bg-emerald-500');
      } else if (info.status === '사용중' || info.status === '사용 중') {
        badge.classList.add('bg-rose-500');
      } else {
        badge.classList.add('bg-slate-500');
      }

      const modal = document.getElementById('eq-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    // 6. 모달 닫기
    function closeEquipmentModal() {
      const modal = document.getElementById('eq-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeEquipmentModal();
    });

    // 7. 도면 빈 공간 클릭 시 좌표 계산기
    const mapContainer = document.getElementById('map-container');
    const coordHelper = document.getElementById('coord-helper');
    mapContainer.addEventListener('click', function(e) {
      if (e.target.closest('button')) return;
      const rect = mapContainer.getBoundingClientRect();
      const x = ((e.clientX - rect.left) / rect.width * 100).toFixed(1);
      const y = ((e.clientY - rect.top) / rect.height * 100).toFixed(1);
      coordHelper.innerHTML = `📍 클릭한 위치 코드: <span class="text-amber-300 font-bold">left: ${x}%; top: ${y}%;</span>`;
    });

    // 8. PWA 서비스 워커 등록 (스마트폰 앱 설치 기능 활성화)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    // 초기 실행 및 30초 자동 새로고침
    loadSheetData();
    setInterval(loadSheetData, 30000);
  </script>

</body>
</html>
